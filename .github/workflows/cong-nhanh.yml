name: cong-nhanh

on:
  pull_request:
    # edited: đổi base phải sinh lượt mới, không được dùng lại lượt của base cũ.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  cong-nhanh:
    name: cong-nhanh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chạy kiểm tra
        run: echo pass
